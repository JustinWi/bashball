<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-analytics.js"></script>
    <style>
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            max-width: 400px;
            padding: 40px;
            border-radius: 10px;
            background: white;
            box-shadow: 0px 0px 30px rgba(0, 0, 0, 0.1);
        }
        .input-field {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h4 class="center-align">Register / Sign In</h4>
    <div id="error-message" class="red-text center-align"></div>
    <div class="input-field">
        <input id="email" type="email" class="validate">
        <label for="email">Email</label>
    </div>
    <div class="input-field">
        <input id="password" type="password" class="validate">
        <label for="password">Password</label>
    </div>
    <div class="input-field">
        <input id="confirm-password" type="password" class="validate">
        <label for="confirm-password">Confirm Password</label>
    </div>
    <div class="center-align">
        <button id="register-btn" class="waves-effect waves-light btn">Register</button>
        <button id="login-btn" class="waves-effect waves-light btn grey">Login</button>
        <button id="reset-password-btn" class="waves-effect waves-light btn blue">Reset Password</button>
    </div>
    <div class="center-align">
        <button id="logout-btn" class="waves-effect waves-light btn red" style="margin-top: 20px; display: none;">Logout</button>
    </div>
</div>
<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCzwB12Y3rwLsM1kx-wh7qWO5xDl04z0kM",
        authDomain: "bashball-score.firebaseapp.com",
        projectId: "bashball-score",
        storageBucket: "bashball-score.appspot.com",
        messagingSenderId: "491783371429",
        appId: "1:491783371429:web:e4a61a901d469e23aaab4c"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Register User
    document.getElementById("register-btn").addEventListener("click", function () {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm-password").value;
        
        if (password !== confirmPassword) {
            document.getElementById("error-message").textContent = "Passwords do not match.";
            return;
        }
        
        auth.createUserWithEmailAndPassword(email, password)
            .then((userCredential) => {
                const user = userCredential.user;
                console.log("Registration successful", user);
                document.getElementById("error-message").textContent = "Registration successful!";
                document.getElementById("logout-btn").style.display = "block";
            })
            .catch((error) => {
                document.getElementById("error-message").textContent = error.message;
            });
    });

    // Login User
    document.getElementById("login-btn").addEventListener("click", function () {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                const user = userCredential.user;
                console.log("Login successful", user);
                document.getElementById("error-message").textContent = "Login successful!";
                document.getElementById("logout-btn").style.display = "block";
            })
            .catch((error) => {
                document.getElementById("error-message").textContent = error.message;
            });
    });

    // Reset Password
    document.getElementById("reset-password-btn").addEventListener("click", function () {
        const email = document.getElementById("email").value;

        auth.sendPasswordResetEmail(email)
            .then(() => {
                document.getElementById("error-message").textContent = "Password reset email sent!";
            })
            .catch((error) => {
                document.getElementById("error-message").textContent = error.message;
            });
    });

    // Logout User
    document.getElementById("logout-btn").addEventListener("click", function () {
        auth.signOut()
            .then(() => {
                console.log("Logout successful");
                document.getElementById("error-message").textContent = "Logout successful!";
                document.getElementById("logout-btn").style.display = "none";
            })
            .catch((error) => {
                document.getElementById("error-message").textContent = error.message;
            });
    });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
