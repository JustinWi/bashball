<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bashball Scorekeeper</title>
  <link rel="stylesheet" href="./style/score.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Gothic&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Common Header for all screens -->
  <header class="app-header">
    <a href="index.html" class="home-link" title="Back to Home">
      <i class="fas fa-home"></i>
    </a>
    <img src="img/logo.png" alt="Bashball Logo" class="logo">
    <h1 class="app-title">Bashball Scorekeeper</h1>
    <div class="field-selector" id="fieldSelector">
      <span id="selectedField">Select Field</span>
    </div>
  </header>

  <!-- Password Protection Screen -->
  <div class="password-screen" id="passwordScreen">
    <div class="password-content">
      <h2>Scorekeeper Access</h2>
      <p>Enter the scorekeeper password:</p>
      <input type="password" id="passwordInput" placeholder="Password">
      <div class="password-buttons">
        <button id="submitPassword">Submit</button>
        <button id="backToHome" onclick="window.location.href='index.html'">Back to Home</button>
      </div>
      <div id="passwordError" style="color: red; display: none; margin-top: 10px;">Incorrect password. Please try again.</div>
    </div>
  </div>

  <!-- Location Selection Modal -->
  <div id="locationModal" class="modal">
    <div class="modal-content">
      <h2>Select Your Field</h2>
      <p>Choose which field you're scoring for:</p>
      <div class="field-buttons">
        <button class="field-btn" onclick="selectField('DVC')">DVC</button>
        <button class="field-btn" onclick="selectField('Las Lomas')">Las Lomas</button>
      </div>
      <div class="modal-footer">
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>

  <!-- Scoring Screen -->
  <div class="scoring-screen" id="scoringScreen">
    <h1 class="team-name" id="teamName">Team Name</h1>
    <div class="score" id="currentScore">0</div>
    <div class="score-edit" id="scoreEdit" style="display: none;">
      <input type="number" id="manualScoreInput" min="-10000" max="100000" placeholder="Enter score">
      <button id="saveScoreButton">Save</button>
    </div>
    
    <div class="score-buttons">
      <button class="score-btn" id="btnPlus4">+4</button>
      <button class="score-btn" id="btnPlus3">+3</button>
      <button class="score-btn" id="btnPlus2">+2</button>
      <button class="score-btn" id="btnPlus1">+1</button>
      <button class="score-btn" id="btnMinus1">-1</button>
    </div>

    <!-- History Section (hidden by default) -->
    <div id="historySection" class="history-section">
        <h2>History</h2> <!-- Visible title when history is shown -->
        <table>
        <thead>
            <tr>
            <th>Points</th> <!-- Renamed "Added" to "Points" -->
            <th>Score</th>
            <th>Time</th>
            </tr>
        </thead>
        <tbody id="historyTable">
            <!-- Scores will be dynamically injected here -->
        </tbody>
        </table>
    </div>
  </div>

  <!-- New Game Screen -->
  <div class="new-game-screen" id="newGameScreen" style="display:none;">
    <h1>Start New Game</h1>
    <div class="field-display">Field: <span id="newGameField">-</span></div>
    <select id="team1Select">
      <option value="" disabled selected>Pick a team</option>
      <option value="Mambas">Mambas</option>
      <option value="Snappers">Snappers</option>
      <option value="Honey Badgers">Honey Badgers</option>
      <option value="Hyenas">Hyenas</option>
      <option value="Scorpions">Scorpions</option>
      <option value="Hammerheads">Hammerheads</option>
      <option value="Dartfrogs">Dartfrogs</option>
      <option value="Crawdads">Crawdads</option>
    </select>
    <div class="vs">vs</div>
    <select id="team2Select" disabled>
      <option value="" disabled selected>Pick a team</option>
      <option value="Mambas">Mambas</option>
      <option value="Snappers">Snappers</option>
      <option value="Honey Badgers">Honey Badgers</option>
      <option value="Hyenas">Hyenas</option>
      <option value="Scorpions">Scorpions</option>
      <option value="Hammerheads">Hammerheads</option>
      <option value="Dartfrogs">Dartfrogs</option>
      <option value="Crawdads">Crawdads</option>
    </select>
    <div id="errorMessage" style="color: red; display: none;">Please select two different teams.</div>
    <button id="startGameButton" disabled>Start Game</button>
  </div>

  <!-- Footer Section -->
  <footer class="app-footer">
    <button id="newGameButton" class="footer-btn"><i class="fa fa-redo"></i></button>
    <button id="historyButton" class="footer-btn"><i class="fa fa-history"></i></button>
    <button id="switchTeamsButton" class="footer-btn"><i class="fa fa-exchange-alt"></i></button>
  </footer>  

  <script type="module" src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js"></script>
  <script type="module" src="./js/firebaseConfig.js"></script>
  <script type="module" src="./js/score.js"></script>
  
</body>
</html>
